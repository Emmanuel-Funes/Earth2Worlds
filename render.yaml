services:
  - type: web
    name: earth2worlds
    runtime: python
    plan: free
    branch: rotaterra-completo
    buildCommand: pip install -r requirements.txt && python -m app.init_db
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: PORT
        value: 10000
      - key: EARTHDATA_USERNAME
        sync: false
      - key: EARTHDATA_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
