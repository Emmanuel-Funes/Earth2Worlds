name: Probar GEOS-FP (clima y evapotranspiración del día)

on:
  pull_request:
    paths:
      - "rotaterra/fuentes/geos_fp.py"
      - "probar_geos_fp.py"
      - ".github/workflows/probar-geos-fp.yml"
  workflow_dispatch:
    inputs:
      lat:
        description: "Latitud del centro del lote (ej. -33.70)"
        default: "-33.70"
      lon:
        description: "Longitud del centro del lote (ej. -65.30)"
        default: "-65.30"
      desde:
        description: "Desde (AAAA-MM-DD). Vacío = hace 4 días"
        default: ""
      hasta:
        description: "Hasta (AAAA-MM-DD). Vacío = hoy"
        default: ""

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Pedir el clima y la evapotranspiración de los últimos días a GEOS-FP (no usa cuenta)
        env:
          LAT: ${{ inputs.lat || '-33.70' }}
          LON: ${{ inputs.lon || '-65.30' }}
          DESDE: ${{ inputs.desde }}
          HASTA: ${{ inputs.hasta }}
        run: python probar_geos_fp.py "$LAT" "$LON" "$DESDE" "$HASTA"
