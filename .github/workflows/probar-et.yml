name: Probar MODIS (evapotranspiración)

on:
  pull_request:
    paths:
      - "rotaterra/fuentes/et.py"
      - "probar_et.py"
      - ".github/workflows/probar-et.yml"
  workflow_dispatch:
    inputs:
      esquinas:
        description: "Esquinas del lote como 'lat, lon; lat, lon; lat, lon; lat, lon' (copiadas de Google Maps)"
        default: "-33.700, -65.300; -33.700, -65.295; -33.705, -65.295; -33.705, -65.300"
      desde:
        description: "Desde (AAAA-MM-DD). Vacío = automático: hace 60 días"
        default: ""
      hasta:
        description: "Hasta (AAAA-MM-DD). Vacío = automático: hace 10 días"
        default: ""

jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Pedir la evapotranspiración a la NASA
        env:
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
          # en un PR no hay inputs: se usa el lote de ejemplo y enero de 2026
          ESQUINAS: ${{ inputs.esquinas || '-33.700, -65.300; -33.700, -65.295; -33.705, -65.295; -33.705, -65.300' }}
          DESDE: ${{ inputs.desde }}
          HASTA: ${{ inputs.hasta }}
        run: DESDE="${DESDE:-$(date -u -d "-60 days" +%F)}"; HASTA="${HASTA:-$(date -u -d "-10 days" +%F)}"; python probar_et.py "$ESQUINAS" "$DESDE" "$HASTA"
