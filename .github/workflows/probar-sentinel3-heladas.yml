name: Probar Sentinel-3 (heladas)

on:
  pull_request:
    paths:
      - "rotaterra/fuentes/sentinel3_heladas.py"
      - "probar_sentinel3_heladas.py"
      - ".github/workflows/probar-sentinel3-heladas.yml"
  workflow_dispatch:
    inputs:
      esquinas:
        description: "Esquinas del lote como 'lat, lon; lat, lon; lat, lon; lat, lon' (copiadas de Google Maps)"
        default: "-33.700, -65.300; -33.700, -65.295; -33.705, -65.295; -33.705, -65.300"
      desde:
        description: "Desde (AAAA-MM-DD)"
        default: "2026-09-15"
      hasta:
        description: "Hasta (AAAA-MM-DD)"
        default: "2026-09-30"

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Pedir la temperatura de superficie nocturna a Sentinel-3
        env:
          COPERNICUS_USERNAME: ${{ secrets.COPERNICUS_USERNAME }}
          COPERNICUS_PASSWORD: ${{ secrets.COPERNICUS_PASSWORD }}
          # en un PR no hay inputs: lote de ejemplo y la quincena con la helada del 22/9 (specs 030 y 035)
          ESQUINAS: ${{ inputs.esquinas || '-33.700, -65.300; -33.700, -65.295; -33.705, -65.295; -33.705, -65.300' }}
          DESDE: ${{ inputs.desde || '2026-09-15' }}
          HASTA: ${{ inputs.hasta || '2026-09-30' }}
        run: python probar_sentinel3_heladas.py "$ESQUINAS" "$DESDE" "$HASTA"
