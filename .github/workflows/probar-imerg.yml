name: Probar IMERG (lluvia)

on:
  pull_request:
    paths:
      - "rotaterra/fuentes/imerg.py"
      - "rotaterra/fuentes/earthdata.py"
      - "probar_imerg.py"
      - ".github/workflows/probar-imerg.yml"
  workflow_dispatch:
    inputs:
      lat:
        description: "Latitud del centro del lote (ej. -33.70)"
        default: "-33.70"
      lon:
        description: "Longitud del centro del lote (ej. -65.30)"
        default: "-65.30"
      desde:
        description: "Desde (AAAA-MM-DD)"
        default: "2026-01-01"
      hasta:
        description: "Hasta (AAAA-MM-DD)"
        default: "2026-01-14"

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Pedir la lluvia a IMERG
        env:
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
          # en un PR no hay inputs: se usa el lote de ejemplo y dos semanas de verano
          LAT: ${{ inputs.lat || '-33.70' }}
          LON: ${{ inputs.lon || '-65.30' }}
          DESDE: ${{ inputs.desde || '2026-01-01' }}
          HASTA: ${{ inputs.hasta || '2026-01-14' }}
        run: python probar_imerg.py "$LAT" "$LON" "$DESDE" "$HASTA"
