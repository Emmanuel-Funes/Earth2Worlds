name: Probar GRACE (napa y agua profunda)

on:
  pull_request:
    paths:
      - "rotaterra/fuentes/grace.py"
      - "probar_grace.py"
      - ".github/workflows/probar-grace.yml"
  workflow_dispatch:
    inputs:
      lat:
        description: "Latitud del centro del lote (ej. -33.7025)"
        default: "-33.7025"
      lon:
        description: "Longitud del centro del lote (ej. -65.2975)"
        default: "-65.2975"
      desde:
        description: "Desde (AAAA-MM-DD). Vacío = automático: hace 240 días"
        default: ""
      hasta:
        description: "Hasta (AAAA-MM-DD). Vacío = automático: hace 60 días"
        default: ""

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Pedir la napa a GRACE-FO
        env:
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
          LAT: ${{ inputs.lat || '-33.7025' }}
          LON: ${{ inputs.lon || '-65.2975' }}
          DESDE: ${{ inputs.desde }}
          HASTA: ${{ inputs.hasta }}
        run: DESDE="${DESDE:-$(date -u -d "-240 days" +%F)}"; HASTA="${HASTA:-$(date -u -d "-60 days" +%F)}"; python probar_grace.py "$LAT" "$LON" "$DESDE" "$HASTA"
