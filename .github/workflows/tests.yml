name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: pytest -v
      - name: La API arranca como en Render y pide la clave (spec 022)
        env:
          ROTATERRA_API_KEYS: clave-solo-para-esta-prueba
          PORT: "8000"
        run: |
          uvicorn rotaterra.api:app --host 0.0.0.0 --port $PORT &
          for i in $(seq 1 30); do curl -sf http://localhost:$PORT/salud && break; sleep 1; done
          curl -sf http://localhost:$PORT/salud
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:$PORT/satelites)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "X-API-Key: $ROTATERRA_API_KEYS" http://localhost:$PORT/satelites)" = 200
          echo "La API arrancó, /salud responde, sin clave da 401 y con clave da 200"

  tests-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: prueba
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - name: Tests de la base contra PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql://postgres:prueba@localhost:5432/postgres
        run: pytest -v tests/test_base_y_actualizar.py
