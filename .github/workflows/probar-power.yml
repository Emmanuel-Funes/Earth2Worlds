name: Probar POWER (clima)

on:
  pull_request:
    paths:
      - "rotaterra/fuentes/power.py"
      - "probar_power.py"
      - ".github/workflows/probar-power.yml"
  workflow_dispatch:
    inputs:
      lat:
        description: "Latitud del lote (ej. -33.68 para Villa Mercedes)"
        default: "-33.68"
      lon:
        description: "Longitud del lote (ej. -65.46)"
        default: "-65.46"
      desde:
        description: "Desde (AAAA-MM-DD). Vacío = automático: hace 17 días"
        default: ""
      hasta:
        description: "Hasta (AAAA-MM-DD). Vacío = automático: hace 8 días"
        default: ""

jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Pedir el clima a NASA POWER
        env:
          # en un PR no hay inputs: se usa el lote de ejemplo
          LAT: ${{ inputs.lat || '-33.68' }}
          LON: ${{ inputs.lon || '-65.46' }}
          DESDE: ${{ inputs.desde }}
          HASTA: ${{ inputs.hasta }}
        run: DESDE="${DESDE:-$(date -u -d "-17 days" +%F)}"; HASTA="${HASTA:-$(date -u -d "-8 days" +%F)}"; python probar_power.py "$LAT" "$LON" "$DESDE" "$HASTA"
