name: Probar POWER (lluvia de respaldo)

on:
  pull_request:
    paths:
      - "rotaterra/fuentes/power_lluvia.py"
      - "probar_power_lluvia.py"
      - ".github/workflows/probar-power-lluvia.yml"
  workflow_dispatch:
    inputs:
      esquinas:
        description: "Esquinas del lote como 'lat, lon; lat, lon; lat, lon; lat, lon' (copiadas de Google Maps)"
        default: "-33.700, -65.300; -33.700, -65.295; -33.705, -65.295; -33.705, -65.300"
      desde:
        description: "Desde (AAAA-MM-DD)"
        default: "2026-01-01"
      hasta:
        description: "Hasta (AAAA-MM-DD)"
        default: "2026-01-14"

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Pedir la lluvia de respaldo a NASA POWER
        env:
          # en un PR no hay inputs: se usa el lote de ejemplo y las dos semanas en que IMERG dio 32 mm
          ESQUINAS: ${{ inputs.esquinas || '-33.700, -65.300; -33.700, -65.295; -33.705, -65.295; -33.705, -65.300' }}
          DESDE: ${{ inputs.desde || '2026-01-01' }}
          HASTA: ${{ inputs.hasta || '2026-01-14' }}
        run: python probar_power_lluvia.py "$ESQUINAS" "$DESDE" "$HASTA"
