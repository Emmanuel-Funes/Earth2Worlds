name: Probar ECOSTRESS (heladas por zona)

on:
  pull_request:
    paths:
      - "rotaterra/fuentes/ecostress_heladas.py"
      - "probar_ecostress_heladas.py"
      - ".github/workflows/probar-ecostress-heladas.yml"
  workflow_dispatch:
    inputs:
      esquinas:
        description: "Esquinas del lote como 'lat, lon; lat, lon; lat, lon; lat, lon' (copiadas de Google Maps)"
        default: "-33.700, -65.300; -33.700, -65.295; -33.705, -65.295; -33.705, -65.300"
      desde:
        description: "Desde (AAAA-MM-DD)"
        default: "2026-08-01"
      hasta:
        description: "Hasta (AAAA-MM-DD)"
        default: "2026-10-27"

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Pedir la temperatura de superficie nocturna de 70 m a ECOSTRESS
        env:
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
          # en un PR no hay inputs: lote de ejemplo y agosto a octubre de 2026, con la noche del 8/10 (informe del 27/10)
          ESQUINAS: ${{ inputs.esquinas || '-33.700, -65.300; -33.700, -65.295; -33.705, -65.295; -33.705, -65.300' }}
          DESDE: ${{ inputs.desde || '2026-08-01' }}
          HASTA: ${{ inputs.hasta || '2026-10-27' }}
        run: python probar_ecostress_heladas.py "$ESQUINAS" "$DESDE" "$HASTA"
