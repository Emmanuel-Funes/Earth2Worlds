name: Probar SMAP (productividad)

on:
  pull_request:
    paths:
      - "rotaterra/fuentes/smap_carbono.py"
      - "probar_smap_carbono.py"
      - ".github/workflows/probar-smap-carbono.yml"
  workflow_dispatch:
    inputs:
      esquinas:
        description: "Esquinas del lote como 'lat, lon; lat, lon; lat, lon; lat, lon' (copiadas de Google Maps)"
        default: "-33.700, -65.300; -33.700, -65.295; -33.705, -65.295; -33.705, -65.300"
      desde:
        description: "Desde (AAAA-MM-DD). Vacío = automático: hace 45 días"
        default: ""
      hasta:
        description: "Hasta (AAAA-MM-DD). Vacío = automático: hace 2 días"
        default: ""

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Pedir la productividad diaria a SMAP L4 Carbono
        env:
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
          # en un PR no hay inputs: lote de ejemplo y agosto a octubre de 2026
          ESQUINAS: ${{ inputs.esquinas || '-33.700, -65.300; -33.700, -65.295; -33.705, -65.295; -33.705, -65.300' }}
          DESDE: ${{ inputs.desde }}
          HASTA: ${{ inputs.hasta }}
        run: DESDE="${DESDE:-$(date -u -d "-45 days" +%F)}"; HASTA="${HASTA:-$(date -u -d "-2 days" +%F)}"; python probar_smap_carbono.py "$ESQUINAS" "$DESDE" "$HASTA"
